<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Boat preview</title>
<!-- The boat page's live preview (/boat embeds it): the game's own yacht (public/game/yacht.js) on a calm sea, turned
     by dragging. The page sends it the look to show: postMessage({ type: 'look', boat }) and ({ type: 'pose', down }). -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dcecf6; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; outline: 0; }
  canvas:active { cursor: grabbing; }
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three@0.160.0/build/three.module.min.js", "three/addons/": "/vendor/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="c" aria-label="Your boat, turn it by dragging"></canvas>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { BoatView, lookFrom, playerLook } from '/game/yacht.js';

const SKY = new THREE.Color('#dcecf6');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); // alpha: the preset pictures have no background
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = SKY;
scene.fog = new THREE.Fog(SKY, 70, 260);
scene.add(new THREE.HemisphereLight('#e4f0ff', '#2c4a5c', 0.95));
const SUN = new THREE.Vector3(-0.45, 0.8, -0.4).normalize();
const sun = new THREE.DirectionalLight('#fff1dc', 3);
sun.position.copy(SUN).multiplyScalar(40); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 100 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// a soft sky to reflect in the gelcoat and the steel
const env = new THREE.Scene();
env.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide,
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'varying vec3 vP; void main(){ float h = normalize(vP).y; vec3 c = h > 0.0 ? mix(vec3(0.86,0.93,0.97), vec3(0.42,0.66,0.88), pow(h, 0.6)) : vec3(0.1,0.3,0.42); gl_FragColor = vec4(c, 1.0); }',
})));
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(env, 0.02).texture; pm.dispose();

// the sea: a calm plane that fades into the sky
const sea = new THREE.Mesh(new THREE.CircleGeometry(400, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#1d5f80', roughness: 0.18, metalness: 0.1, envMapIntensity: 0.7 }));
sea.receiveShadow = true; scene.add(sea);

// where the hull meets the water: the sea darkened in her shade against the topsides, a broken band of foam along the
// waterline that widens at the bow, and a little wash off the transom, all running aft past her as she sails. In her
// own frame (bow to −z); uOff moves the waterline to leeward as she heels.
const contact = new THREE.Mesh(new THREE.PlaneGeometry(12, 22).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uSpd: { value: 0.55 }, uOff: { value: 0 } }, transparent: true, depthWrite: false,
  vertexShader: 'varying vec2 vP; void main(){ vP = position.xz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform float uTime, uSpd, uOff; varying vec2 vP;
    float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float n(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
    float fbm(vec2 p) { return n(p) * 0.5 + n(p * 2.3 + 7.1) * 0.3 + n(p * 5.3 + 3.7) * 0.2; }
    const float HL = 4.95, HB = 1.5; // half the waterline's length and beam
    void main() {
      vec2 L = vec2(-vP.y, vP.x - uOff); // metres towards the bow, and across
      float s = L.x / HL, ay = abs(L.y), d, behind = -L.x - HL;
      if (s > 1.0) d = length(vec2(L.x - HL, L.y));
      else if (s < -1.0) d = max(ay - HB * 0.85, behind);
      else d = ay - (s > 0.0 ? HB * sqrt(max(0.0, 1.0 - s * s)) : HB * (1.0 - 0.15 * s * s)); // metres outside the hull
      if (d < -0.15) discard;
      float bow = smoothstep(-0.1, 0.9, s), nz = fbm((vP + vec2(0.0, uTime * 1.6 * uSpd)) * 1.7);
      float w = 0.22 + uSpd * (0.3 + 1.3 * bow);
      float foam = smoothstep(0.52, 0.8, exp(-max(d, 0.0) / w) * 0.85 + nz * 0.55 - 0.2) * (0.45 + 0.55 * uSpd);
      float wash = step(0.0, behind) * exp(-ay / (0.7 + behind * 0.15)) * exp(-behind / 5.0);
      foam = max(foam, smoothstep(0.45, 0.85, wash * 0.9 + nz * 0.5 - 0.15) * uSpd);
      float shade = (1.0 - smoothstep(-0.2, 1.4, d)) * 0.32;
      float a = max(foam * 0.85, shade);
      if (a < 0.01) discard;
      gl_FragColor = vec4(mix(vec3(0.02, 0.09, 0.12), vec3(0.93, 0.96, 0.98), foam / max(foam + shade, 0.001)), a);
    }`,
}));
contact.position.y = 0.01; contact.renderOrder = 2; scene.add(contact);

const camera = new THREE.PerspectiveCamera(34, 1, 0.3, 1000);
camera.position.set(19, 7.5, -24);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 7.4, 0.2);
Object.assign(controls, { enableDamping: true, dampingFactor: 0.08, enablePan: false, minDistance: 14, maxDistance: 60, maxPolarAngle: Math.PI / 2 - 0.04, autoRotate: true, autoRotateSpeed: 0.6 });
let idle; // the boat turns by itself until you take hold of it, and again a few seconds after
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(idle); });
controls.addEventListener('end', () => { idle = setTimeout(() => { controls.autoRotate = true; }, 6000); });

// a gentle swell so she looks afloat
const W = [{ A: 0.12, k: 0.22, dx: 0.8, dz: 0.6, w: 0.9, ph: 0 }, { A: 0.06, k: 0.4, dx: -0.3, dz: 0.95, w: 1.4, ph: 1.3 }];
const UP = { x: 0, z: 0, h: 0, twa: 0.78, awa: 0.45, heel: 13, rudder: 0, sail: 16, luff: 0, trim: 'ok', kite: false, kiteFill: 0 };
const DOWN = { x: 0, z: 0, h: 0, twa: 2.55, awa: 2.1, heel: 5, rudder: 0, sail: 68, luff: 0, trim: 'ok', kite: true, kiteFill: 1 };
let pose = UP, boat = null, pending = playerLook();

function dispose(root) {
  root.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    const mats = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
    for (const m of mats) for (const k of ['map', 'emissiveMap']) if (m[k]?.isCanvasTexture) m[k].dispose();
  });
}
function build(look) {
  if (boat) { scene.remove(boat.root); dispose(boat.root); }
  boat = new BoatView({ look, player: false });
  scene.add(boat.root);
}

addEventListener('message', (e) => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.type === 'hello') parent.postMessage({ type: 'ready' }, location.origin); // the page came up after this did
  if (e.data.type === 'look') pending = lookFrom(e.data.boat); // built on the next frame, so dragging a colour stays smooth
  if (e.data.type === 'pose') pose = e.data.down ? DOWN : UP;
  if (e.data.type === 'thumbs' && Array.isArray(e.data.items)) shoot(e.data.items); // at once: a hidden tab gets no frames
});

// the presets' pictures: each scheme on the game's yacht with her gennaker up, seen from the windward bow quarter, cut at the
// waterline on a clear background. Drawn on this canvas between two frames, then sent to the page as images.
const shotCam = new THREE.PerspectiveCamera(28, 4 / 3, 0.3, 500);
shotCam.position.set(31, 11.5, -18); shotCam.lookAt(-1, 8.3, -1);
const WATERLINE = [new THREE.Plane(new THREE.Vector3(0, 1, 0), 0.02)];
function shoot(items, w = 320, h = 240) {
  const size = renderer.getSize(new THREE.Vector2()), pr = renderer.getPixelRatio(), bg = scene.background, fog = scene.fog;
  renderer.setPixelRatio(1); renderer.setSize(w, h, false); renderer.setClearColor(0x000000, 0); renderer.clippingPlanes = WATERLINE;
  scene.background = null; scene.fog = null; sea.visible = contact.visible = false; if (boat) boat.root.visible = false;
  const out = {};
  for (const { id, boat: b } of items) {
    const v = new BoatView({ look: lookFrom(b) });
    scene.add(v.root);
    for (let i = 0; i < 40; i++) v.update(DOWN, i * 0.1, [], false, { cam: shotCam.position, sun: SUN }); // let the crew settle on the rail
    renderer.render(scene, shotCam);
    out[id] = canvas.toDataURL('image/webp', 0.9);
    scene.remove(v.root); dispose(v.root);
  }
  renderer.clippingPlanes = []; scene.background = bg; scene.fog = fog; sea.visible = contact.visible = true; if (boat) boat.root.visible = true;
  renderer.setPixelRatio(pr); renderer.setSize(size.x, size.y, false);
  parent.postMessage({ type: 'thumbs', shots: out }, location.origin);
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * renderer.getPixelRatio()) || canvas.height !== Math.round(h * renderer.getPixelRatio())) {
    renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
    // stand back far enough to see the whole boat, masthead to bowsprit, in a tall frame or a wide one
    const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), th = tv * camera.aspect;
    const d = Math.max(9.6 / tv, 6.6 / th); // half the height (waterline to masthead) and half the length seen from the quarter
    controls.maxDistance = Math.max(d * 1.6, 30);
    camera.position.sub(controls.target).setLength(d).add(controls.target);
  }
}
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  if (pending) { build(pending); pending = null; }
  resize();
  const t = clock.getElapsedTime();
  boat.update(pose, t, W, false, { cam: camera.position, sun: SUN });
  const cu = contact.material.uniforms;
  cu.uTime.value = t; cu.uSpd.value = pose.kite ? 0.7 : 0.55; cu.uOff.value = -Math.sign(pose.twa) * Math.sin(pose.heel * Math.PI / 180) * 0.9;
  controls.update();
  renderer.render(scene, camera);
});
parent.postMessage({ type: 'ready' }, location.origin);
</script>
</body>
</html>
