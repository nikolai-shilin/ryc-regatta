<title>The venue</title>
<!-- The scene behind a venue's page (/venues/<id>, components/venue-view.tsx): the game itself (public/game) at that
     venue (?venue=), in the afternoon under a clear sky, a race on its course sailed by the game's own skippers, your
     boat among them in your colours, from a minute before the start; a new one once it is over. A drone flies over it
     from one shot to the next (SHOTS): high over the whole water with the land round it, slowly circling; down the
     course from behind the start; along the line; and over the windward mark, looking back down the beat. Drag to turn it, scroll or pinch to come closer.
     The page sends ({ type: 'focus', id }) for the shot to fly to, and the part of the frame its words cover ({ type:
     'inset', l, r, t, b }: fractions of the width and height), so what the drone looks at stands in the part left
     clear. It says ({ type: 'ready' }) when it can take them, ({ type: 'live' }) once its first frame is up, ({ type:
     'arrived', id }) when a flight lands, and ({ type: 'touched' }) when you take hold of the drone. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2a3a; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; outline: 0; opacity: 0; transition: opacity 0.8s ease; }
  canvas.live { opacity: 1; }
  canvas:active { cursor: grabbing; }
</style>
<!-- the venue, before the game's modules read it from the address, and its land (venues.js landFiles) fetched at once -->
<script>(function () {
  var v = 'gocek';
  try { v = new URLSearchParams(location.search).get('venue') || v; } catch (e) {}
  if (!/^[a-z-]+$/.test(v)) v = 'gocek';
  history.replaceState(null, '', location.pathname + '?venue=' + v + '&wind=medium&sky=clear');
  var f = v === 'gocek' ? ['/game/skopea.bin', '/game/skopea.json'] : ['/game/venues/' + v + '.bin', '/game/venues/' + v + '.json'];
  f.forEach(function (h) { var l = document.createElement('link'); l.rel = 'preload'; l.as = 'fetch'; l.href = h; l.crossOrigin = 'anonymous'; document.head.appendChild(l); }); })();</script>
<script type="importmap">{ "imports": { "three": "/vendor/three@0.160.0/build/three.module.min.js", "three/addons/": "/vendor/three@0.160.0/examples/jsm/" } }</script>
<!-- every module the page will load, asked for at once rather than an import at a time, and the yacht with them
     (game/yacht.js); npm test keeps the list in step with the imports -->

<body>
<canvas id="c" aria-label="The race course from the drone, turn the view by dragging"></canvas>
<script type="module">
import { World } from '/game/world.js';
import { followSettings } from '/game/gfx.js';
import { Race, D2R, wrap } from '/game/sim.js';
import { DAYTIMES } from '/game/light.js';

// the light: the afternoon, the land clear round the water (the race's sky reads it from the address)
history.replaceState(null, '', location.search + '&hour=' + DAYTIMES.afternoon.toFixed(2));

const canvas = document.getElementById('c');
const say = (msg) => parent.postMessage(msg, location.origin);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smoother = (x) => { x = clamp(x, 0, 1); return x * x * x * (x * (x * 6 - 15) + 10); };
const STEP = 1 / 60;

let world;
try { world = new World(canvas); } catch (e) { say({ type: 'ready' }); } // no WebGL: the page's own picture shows
if (world) {
  world.showGuides = false;
  const skipFrame = followSettings(world); // Audio & graphics: the level chosen, and the battery saver
  world.mode = 'set-up'; // the drone is flown here, not by the world

  // ---------- the race ----------
  // the game's own skippers sail every boat, yours too; it is warmed up to a little before the gun, in slices, so the
  // page stays live, and sailed again once the leader is home or ten minutes are up
  let race, ready = false;
  const newRace = () => {
    ready = false;
    const r = new Race({ preset: 'medium', fleet: 6, laps: 1, length: 'short', start: 1, seed: 4242 + Math.floor(Math.random() * 50) });
    world.setRace(r);
    const P = r.player;
    P.autoTrim = true; P.crew = 0.2;
    P.ai = { skill: 0.97, lineT: 0.5, lastTack: -999, go: false, mean: r.wind.dir(), dirtyT: 0, hailT: -99, wp: 0, loiter: 1, port: false, dare: 0 };
    race = r;
    (function warm() {
      if (r !== race) return;
      const end = performance.now() + 6;
      while (r.clock < -25 && performance.now() < end) r.step(STEP);
      if (r.clock < -25) setTimeout(warm, 0); else ready = true;
    })();
  };
  newRace();

  // ---------- the drone ----------
  // each shot: where it looks (tx, ty, tz), how far off it is (ld, the log of the distance), how high it stands
  // (el, its elevation) and from which way (az: 0 behind the start line looking up the course)
  let inset = { l: 0, r: 0, t: 0, b: 0 };
  const TAN = Math.tan(27.5 * D2R);
  const clearW = () => Math.max(0.25, 1 - inset.l - inset.r), clearH = () => Math.max(0.2, 1 - inset.t - inset.b);
  const fit = (w, h) => Math.max(w / (TAN * (innerWidth / innerHeight) * clearW()), h / (TAN * clearH()));
  const course = () => {
    const c = race.course, beat = -c.windward.z, lx = (c.pin.x + c.committee.x) / 2, lz = (c.pin.z + c.committee.z) / 2;
    return { c, beat, lx, lz, len: Math.hypot(c.committee.x - c.pin.x, c.committee.z - c.pin.z), loa: race.player.cls?.loa ?? 10.5 };
  };
  const SHOTS = {
    // high over the water, the land round it: the course small in the middle of it (further back on an upright screen)
    waters: () => { const { beat } = course(); return { tx: 0, tz: -beat / 2, ty: 0, ld: Math.log(Math.max(1100, beat * 4) * (innerWidth < innerHeight ? 1.6 : 1)), el: 33 * D2R, az: 0.5, spin: 0.045 }; },
    // the whole course from behind the start, the line in front and the windward mark at the far end
    course: () => { const { beat, len } = course(); return { tx: 0, tz: -beat * 0.5, ty: 0, ld: Math.log(fit(len * 1.8, beat * 0.55) + beat * 0.35), el: 30 * D2R, az: 0.3 }; },
    // the line from just behind it, the committee boat at the near end, the fleet on it
    start: () => { const { lx, lz, len } = course(); return { tx: lx, tz: lz - 10, ty: 2, ld: Math.log(Math.max(70, fit(len * 1.15, 18))), el: 13 * D2R, az: 0.95 }; },
    // the windward mark, from beyond it, looking back down the beat at the fleet coming up
    windward: () => { const { c, beat } = course(); return { tx: c.windward.x, tz: c.windward.z + 25, ty: 1, ld: Math.log(clamp(beat * 0.45, 110, 260)), el: 15 * D2R, az: Math.PI - 0.35 }; },
  };
  const KEYS = ['tx', 'tz', 'ty', 'ld', 'el', 'az'];
  const camS = { tx: 0, tz: 0, ty: 0, ld: 7, el: 0.5, az: 0 }, camV = { tx: 0, tz: 0, ty: 0, ld: 0, el: 0, az: 0 };
  let camG = null, shot = 'waters', flight = null, orbit = 0, spun = 0, zoomK = 1, idle = 0;
  const want = () => {
    const w = SHOTS[shot]();
    w.az += orbit + spun; w.ld += Math.log(zoomK);
    return w;
  };
  // A flight from one shot to the next: the drone climbs as it goes when the two are far apart, so the course stays in
  // the frame, every part of it eased so it starts and stops gently, and longer the further it goes
  const flyTo = (id) => {
    if (!SHOTS[id] || (id === shot && !flight)) return;
    const from = { ...camG };
    shot = id; orbit *= 0.35; spun = 0; zoomK = 1;
    const to = want(), apart = Math.hypot(from.tx - to.tx, from.tz - to.tz);
    const lift = Math.max(0, Math.log(apart * 1.4 + 1) - Math.max(from.ld, to.ld));
    flight = { u: 0, T: clamp(2.8 + apart * 0.004 + Math.abs(to.ld - from.ld) * 0.6, 2.8, 6), from, lift, id };
  };
  const camStep = (dt, t) => {
    const w = want();
    if (!camG) { camG = { ...w }; Object.assign(camS, w); }
    if (flight) {
      const f = flight.from, u = flight.u = Math.min(1, flight.u + dt / flight.T);
      const s = smoother(u), bump = Math.sin(Math.PI * u) ** 2;
      camG.tx = f.tx + (w.tx - f.tx) * s; camG.tz = f.tz + (w.tz - f.tz) * s; camG.ty = f.ty + (w.ty - f.ty) * s;
      camG.ld = f.ld + (w.ld - f.ld) * s + flight.lift * bump;
      camG.el = f.el + (w.el - f.el) * s + (flight.lift ? 10 * D2R * bump : 0);
      camG.az = f.az + wrap(w.az - f.az) * s;
      if (u >= 1) { flight = null; say({ type: 'arrived', id: shot }); }
    } else {
      const k = 1 - Math.exp(-dt * 2.2);
      for (const key of KEYS) camG[key] += (key === 'az' ? wrap(w.az - camG.az) : w[key] - camG[key]) * k;
    }
    // the drone follows that path on a short, critically damped spring, so nothing it does ever jerks
    const om = 6, h = Math.min(dt, 1 / 30);
    for (const k of KEYS) {
      const e = k === 'az' ? wrap(camG.az - camS.az) : camG[k] - camS[k];
      camV[k] += (om * om * e - 2 * om * camV[k]) * h; camS[k] += camV[k] * h;
    }
    const d = Math.exp(camS.ld), c = Math.cos(camS.el), sw = 0.008 * d, cam = world.camera;
    cam.position.set(camS.tx - Math.sin(camS.az) * d * c + Math.sin(t * 0.37) * sw, camS.ty + 1 + d * Math.sin(camS.el) + Math.sin(t * 0.53) * sw * 0.5, camS.tz + Math.cos(camS.az) * d * c + Math.cos(t * 0.29) * sw);
    cam.up.set(0, 1, 0); cam.lookAt(camS.tx, camS.ty, camS.tz); cam.fov = 55;
    // the sea's haze drawn back as the drone climbs, so the course reads from up there
    const hi = Math.max(0, cam.position.y - 40), L = world.light;
    world.waterU.uFogNear.value = L.fogNear + hi * 0.8; world.waterU.uFogFar.value = L.fogFar + hi * 3;
  };

  const size = () => {
    world.resize(innerWidth, innerHeight);
    const w = innerWidth, h = innerHeight, cx = w * (inset.l + clearW() / 2), cy = h * (inset.t + clearH() / 2);
    world.camera.setViewOffset(w, h, w / 2 - cx, h / 2 - cy, w, h);
    world.camera.updateProjectionMatrix();
  };
  size(); addEventListener('resize', size);

  // drag to circle, wheel or pinch to come closer; the drone drifts round by itself until you take hold, and again after
  let drag = null, pinch = 0;
  const touches = new Map();
  const touched = () => { if (idle <= 0) say({ type: 'touched' }); idle = 6; };
  canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); touches.set(e.pointerId, e.clientX); drag = e.clientX; touched(); });
  canvas.addEventListener('pointermove', (e) => {
    if (!touches.has(e.pointerId)) return;
    touches.set(e.pointerId, e.clientX);
    if (touches.size === 2) { const [a, b] = [...touches.values()], d = Math.abs(a - b); if (pinch) zoomK = clamp(zoomK * pinch / Math.max(d, 1), 0.4, 2.5); pinch = d; return; }
    if (drag != null) { orbit -= (e.clientX - drag) * 0.006; drag = e.clientX; touched(); }
  });
  const up = (e) => { touches.delete(e.pointerId); pinch = 0; drag = touches.size ? [...touches.values()][0] : null; };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoomK = clamp(zoomK * Math.exp(e.deltaY * 0.001), 0.4, 2.5); touched(); }, { passive: false });

  addEventListener('message', (e) => {
    if (e.origin !== location.origin || !e.data) return;
    const d = e.data;
    if (d.type === 'hello') say({ type: 'ready' }); // the page came up after this did
    if (d.type === 'focus' && SHOTS[d.id]) { if (camG) flyTo(d.id); else shot = d.id; }
    if (d.type === 'inset') { inset = d; size(); }
  });

  // the loop starts once the land is in
  let last = performance.now(), acc = 0, t = 0;
  world.ready().then(() => { last = performance.now(); requestAnimationFrame(loop); });
  function loop(now) {
    requestAnimationFrame(loop);
    if (skipFrame(now)) return;
    if (document.hidden || !ready) { last = now; return; }
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    t += dt; acc += dt;
    while (acc >= STEP) { race.step(STEP); acc -= STEP; }
    if (race.boats.every((b) => b.done) || race.clock > 600) { newRace(); return; } // the last frame stays up while the next warms
    if (idle > 0) idle -= dt; else if (!flight) { orbit += dt * 0.02; spun += dt * (SHOTS[shot]().spin || 0); }
    camStep(dt, t);
    world.frame(dt, race.t);
    if (!canvas.classList.contains('live')) { canvas.classList.add('live'); say({ type: 'live' }); }
  }
}
say({ type: 'ready' });
</script>
</body>
