          t('Open it in Safari or Chrome if you came from a link inside another app.', 'Открой в Safari или Chrome, если пришёл по ссылке из другого приложения.', 'Ábrelo en Safari o Chrome si llegaste desde un enlace en otra app.', 'Öffne es in Safari oder Chrome, wenn du über einen Link in einer anderen App gekommen bist.', 'Başka bir uygulamadaki bağlantıdan geldiysen Safari veya Chrome’da aç.', 'Ouvre la page dans Safari ou Chrome si tu es arrivé par un lien dans une autre appli.'),
          t('Close other tabs with games, maps or videos.', 'Закрой другие вкладки с играми, картами или видео.', 'Cierra otras pestañas con juegos, mapas o vídeos.', 'Schließe andere Tabs mit Spielen, Karten oder Videos.', 'Oyun, harita veya video açık olan diğer sekmeleri kapat.', 'Ferme les autres onglets avec des jeux, des cartes ou des vidéos.'),
          t('Try again. It often works the second time.', 'Попробуй ещё раз — со второго раза часто получается.', 'Inténtalo de nuevo: a menudo funciona a la segunda.', 'Versuch es nochmal – beim zweiten Mal klappt es oft.', 'Tekrar dene. Genelde ikinci seferde çalışır.', 'Réessaie. Ça marche souvent la deuxième fois.'),
        ];
        var ol = $('lFix'); ol.textContent = '';
        steps.forEach(function (x) { var li = document.createElement('li'); li.textContent = x; ol.appendChild(li); });
      }
      fail(why);
    },
    // main.js, once it knows the race: its venue as the title, and its numbers under it ([label, value, unit, line] each);
    // the ticker says what's coming up: the venue, then (next) the start sequence
    // (place: the venue for the ticker when the title is something else, a newcomer's first race)
    race: function (venue, cells, next, place) {
      var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
      $('lH').textContent = venue;
      $('lTick').innerHTML = esc(t('Coming up', 'Дальше', 'A continuación', 'Als Nächstes', 'Sırada', 'À suivre')) + ' · <b>' + esc(place || venue) + '</b>' + (next ? '<span class="l-tn"> · ' + esc(next) + '</span>' : '');
      var box = $('lCells');
      box.innerHTML = cells.map(function (c) { return '<div><span class="meta">' + esc(c[0]) + '</span><b>' + esc(c[1]) + (c[2] ? '<small>' + esc(c[2]) + '</small>' : '') + '</b><em>' + esc(c[3]) + '</em></div>'; }).join('');
      box.hidden = false;
    },
    // main.js: the scene is built. Fill the bar, let the first frames render under it, then fade into the race.
    done: function (start) {
      if (failed || fixing) return;
      if (ready) return start();
      ready = true; clearInterval(tipTimer); requestAnimationFrame(tick);
      try { sessionStorage.removeItem(RELOAD); } catch (e) {}
      var go = function () {
        introIn = function () {};
        root.classList.add('out'); if (intro) intro.classList.add('out');
        // (after the intro: it fades first, in a fifth of a second, so the Ready card doesn't come up under its cards)
        setTimeout(start, intro ? 200 : 0); setTimeout(function () { root.hidden = true; if (intro) intro.hidden = true; }, 500);
      };
      if (intro && !introGo) { // the intro waits for Start
        introIn = go; intro.classList.add('ready'); $('iStartT').textContent = t('Start the race', 'Начать гонку', 'Empezar la regata', 'Regatta starten', 'Yarışı başlat', 'Lancer la régate');
        try { $('iStart').focus({ preventScroll: true }); } catch (e) {}
        return;
      }
      setTimeout(go, intro ? 300 : 700);
    },
  };
})();
</script>
