  /* ---------- loading the race, the pause card and the confirmation (the RYC design canvas: I2, S4, S6) ---------- */
  /* the preloader: today's photo of the game under the home page's hero shade, the RYC header, the race's name, real
     progress (the files as they arrive: three.js, the game's modules, the yacht) and a sailing tip while it loads */
  #loading { position: fixed; inset: 0; z-index: 30; overflow: hidden; background: #0b3550; color: #fff; transition: opacity .45s ease; }
  #loading[hidden] { display: none; }
  #loading.out { opacity: 0; pointer-events: none; }
  #loading .l-photo { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transform: scale(1.08); transition: opacity .8s ease, transform 16s cubic-bezier(.2,.6,.3,1); }
  #loading .l-photo.on { opacity: 1; transform: scale(1); }
  #loading .l-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(4,10,16,.84) 0%, rgba(4,10,16,.58) 40%, rgba(4,10,16,.12) 80%), linear-gradient(180deg, rgba(4,10,16,.45) 0%, rgba(4,10,16,0) 22%); }
  #loading .l-head { position: absolute; left: calc(48px + var(--sl)); top: calc(28px + var(--st)); display: flex; align-items: center; gap: 14px; }
  #loading .l-logo { width: 50px; height: 25px; filter: invert(1); }
  #loading .l-head .kicker { color: #fff; font-size: 12px; letter-spacing: 0.02em; }
  #loading .l-in { position: absolute; left: calc(48px + var(--sl)); right: 24px; bottom: calc(34px + var(--sb)); max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
  #loading .l-in > .kicker { color: #fff; }
  #loading h1 { margin: 0; font: 300 58px/0.95 var(--serif); letter-spacing: -0.025em; }
  #loading .l-sub { margin: 0; font: 15px/1.45 var(--serif); color: rgba(255,255,255,.92); }
  #loading .l-prog { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
  #loading .l-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  #loading .l-row .meta { color: #fff; }
  #loading .l-pct { font-variant-numeric: tabular-nums; color: rgba(255,255,255,.7); }
  #loading .l-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); overflow: hidden; }
  #loading .l-bar i { display: block; height: 100%; width: 100%; background: #35b0f2; border-radius: 2px; transform-origin: left; transform: scaleX(0); }
  #loading .l-tip { margin: 10px 0 0; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.18); max-width: 360px; min-height: 3.6em; font: 14px/1.45 var(--serif); color: rgba(255,255,255,.88); transition: opacity .35s ease; }
  #loading .l-tip.fade { opacity: 0; }
  #loading .l-tip .meta { display: block; margin-bottom: 3px; color: rgba(255,255,255,.62); text-shadow: none; }
  #loading .l-err { display: none; gap: 10px; margin-top: 4px; }
  #loading .l-err a, #loading .l-err button { height: 44px; padding: 0 22px; border-radius: 54px; border: 2px solid #35b0f2; background: #35b0f2; color: #00131f; font: 17px/1 var(--serif); display: inline-flex; align-items: center; text-decoration: none; text-shadow: none; }
  #loading .l-err a { background: transparent; border-color: rgba(255,255,255,.6); color: #fff; }
  #loading.err .l-err { display: flex; }
  #loading.err .l-bar i { background: #ff6a5c; }
  #loading.err .l-tip, #loading.err .l-pct { display: none; }
  @media (orientation: portrait) {
    #loading .l-head { left: calc(24px + var(--sl)); top: calc(20px + var(--st)); }
    #loading .l-in { left: 24px; bottom: calc(28px + var(--sb)); }

    #loading .l-shade { background: linear-gradient(180deg, rgba(4,10,16,.5) 0%, rgba(4,10,16,.1) 24%, rgba(4,10,16,.25) 46%, rgba(4,10,16,.9) 100%); }
  }

  @media (min-width: 1024px) and (min-height: 640px) {

    #loading h1 { font-size: 92px; } #loading .l-sub { font-size: 19px; } #loading .l-prog, #loading .l-tip { max-width: 420px; } #loading .l-tip { font-size: 15px; }

  /* the pause and confirm cards in the sailing HUD's look: dark glass, a hairline edge, small bold sans, icons */
  #pauseCard .card, #confirmCard .card {

<script>
/* The preloader runs before the game's modules arrive: it speaks the game's language (the same choice as main.js),
   names the race, counts the files in as they land and hands over to the race when main.js calls rycLoader.done(). */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search), TG = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData ? Telegram.WebApp : null;
  var ul = q.get('lang'), cl = (document.cookie.match(/(?:^|; )lang=(en|ru)\b/) || [])[1];
  var ru = ul === 'ru' || ul === 'en' ? ul === 'ru' : cl ? cl === 'ru'
    : /^(ru|uk|be|kk)\b/i.test((TG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.language_code) || navigator.language || '');
  var t = function (en, r) { return ru ? r : en; };
  document.documentElement.lang = ru ? 'ru' : 'en';
  document.title = t('Race', 'Гонка') + ' · Up and down';
  var free = q.get('race') === 'free';
  var day = new Date().toLocaleDateString(ru ? 'ru-RU' : 'en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
  $('lKick').textContent = free ? t('Free race', 'Свободная гонка') : t('Today’s race', 'Гонка дня') + ' · ' + day;
  $('lSub').textContent = free
    ? t('Your wind, your fleet, your course — against the computer boats, under the racing rules.', 'Твой ветер, твой флот, твоя дистанция — против компьютерных лодок, по правилам.')
    : t('The same race for everyone today, so the times compare fairly.', 'Сегодня у всех одна гонка, поэтому время сравнивается честно.');
  $('lRetry').textContent = t('Try again', 'Ещё раз');
  $('lBack').textContent = t('Race hub', 'Меню гонок');

  // the photo: the game seen from the drone, sized by the image optimiser (AVIF ~110 KB), faded in once it is here
  var photo = $('lPhoto'), img = new Image();
  img.onload = function () { photo.style.backgroundImage = 'url("' + img.src + '")'; requestAnimationFrame(function () { photo.classList.add('on'); }); };
  img.src = matchMedia('(orientation: portrait)').matches ? '/_next/image?url=%2Fimages%2Fdrone-port-v3.jpg&w=1080&q=90' : '/_next/image?url=%2Fimages%2Fdrone-desk-v3.jpg&w=1920&q=90';

  // a tip while it loads, a new one every five seconds
  var tips = [
    ['Port tack keeps clear of starboard.', 'Левый галс уступает дорогу правому.'],
    ['In a header, tack. In a lift, point higher.', 'В заходе — поворачивай. В отходе — иди острее.'],
    ['Cross the line just after the gun. Over early and you have to go back.', 'Пересекай линию сразу после сигнала. Фальстарт — придётся вернуться.'],
    ['Round the windward mark leaving it to port, on your left.', 'Верхний знак огибай, оставляя его слева.'],
    ['Keep the telltales green: ease the sheet till they stream, then pull in a touch.', 'Держи колдунчики зелёными: трави шкот, пока не потекут, и чуть выбери.'],
    ['In a gust, ease the sheet before she heels too far.', 'В порыв трави шкот, пока лодка не легла.'],
    ['The kite takes the crew a few seconds to drop — get it down before the gate.', 'Геннакер убирают несколько секунд — снимай его до ворот.'],
    ['Windward boat keeps clear of leeward; the boat astern of the boat ahead.', 'Наветренная лодка уступает подветренной, догоняющая — идущей впереди.'],
  ];
  var tipEl = $('lTip'), ti = Math.floor(Math.random() * tips.length);
  var showTip = function () { tipEl.innerHTML = '<span class="meta">' + t('While the boat is rigged', 'Пока готовим лодку') + '</span>' + tips[ti % tips.length][ru ? 1 : 0]; };
  showTip();
  var tipTimer = setInterval(function () { tipEl.classList.add('fade'); setTimeout(function () { ti++; showTip(); tipEl.classList.remove('fade'); }, 350); }, 5000);

  // progress: each file the race needs has a weight (three.js is most of the bytes); main.js running is the last 12
  var files = [['three.module.js', 30], ['GLTFLoader.js', 4], ['BufferGeometryUtils.js', 3], ['/game/sim.js', 6], ['/game/world.js', 4],
    ['/game/post.js', 1], ['/game/ocean.js', 1], ['/game/light.js', 1], ['/game/land.js', 1], ['/game/skopea.js', 2], ['skopea.json', 1], ['skopea.bin', 2],
    ['/game/yacht.js', 4], ['/game/committee.js', 3], ['/game/wildlife.js', 3], ['/game/hud-bc.js', 3], ['/game/stats.js', 1], ['/game/main.js', 4], ['yacht.glb', 15]];
  var got = {}, target = 0, shown = 0, soft = 0, ready = false, failed = false, t0 = performance.now();
  var steps = { wind: t('Checking the wind', 'Смотрим на ветер'), course: t('Laying the course', 'Ставим дистанцию'), boat: t('Rigging the boat', 'Готовим лодку'),
    slow: t('Slow connection — still loading', 'Медленная связь — ещё грузится'), ready: t('Ready — to the start', 'Готово — на старт'), err: t('The race didn’t load', 'Гонка не загрузилась') };
  var stepEl = $('lStep'), pctEl = $('lPct'), bar = $('lBar'), root = $('loading');
  var step = function (s) { if (stepEl.textContent !== s) stepEl.textContent = s; };
  function count(list) {
    for (var i = 0; i < list.length; i++) for (var j = 0; j < files.length; j++) {
      var f = files[j]; if (!got[f[0]] && list[i].name.indexOf(f[0]) !== -1) { got[f[0]] = 1; target += f[1]; }
    }
  }
  try { new PerformanceObserver(function (l) { count(l.getEntries()); }).observe({ type: 'resource', buffered: true }); }
  catch (e) { count(performance.getEntriesByType('resource')); }
  function label() {
    if (failed) return step(steps.err);
    if (ready) return step(steps.ready);
    if (performance.now() - t0 > 20000) return step(steps.slow);
    var mods = 0; for (var j = 0; j < files.length - 1; j++) if (got[files[j][0]]) mods++;
    step(mods === files.length - 1 ? steps.boat : got['three.module.js'] ? steps.course : steps.wind);
  }
  // the bar eases toward what has arrived and creeps on a little while a big file is on its way, never past 94 before the end
  function tick() {
    if (failed) return;
    if (soft < target) soft = target; else soft = Math.min(soft + 0.035, target + 9, 94);
    var aim = ready ? 100 : soft;
    shown += (aim - shown) * (ready ? 0.16 : 0.07);
    if (aim - shown < 0.05) shown = aim;
    bar.style.transform = 'scaleX(' + (shown / 100).toFixed(4) + ')';
    var p = Math.round(shown); pctEl.textContent = p + '%'; root.setAttribute('aria-valuenow', p);
    label();
    if (shown < 100) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // a file that fails (no network, the CDN down) or the game's code throwing before it's ready: say so and offer a retry
  function fail() { if (ready || failed) return; failed = true; clearInterval(tipTimer); root.classList.add('err'); label(); }
  var ours = function (u) { return !!u && (u.indexOf('/game/') !== -1 || u.indexOf('three') !== -1); };
  window.addEventListener('error', function (e) { var el = e.target; if (el && el.tagName === 'SCRIPT' ? ours(el.src) : ours(e.filename)) fail(); }, true);
  $('lRetry').addEventListener('click', function () { location.reload(); });

  window.rycLoader = {
    // main.js, once it knows the race: its venue as the title, and its numbers under it ([label, value, unit, line] each)
    race: function (venue, cells) {
      var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
      $('lH').textContent = venue;
      var box = $('lCells');
      box.innerHTML = cells.map(function (c) { return '<div><span class="meta">' + esc(c[0]) + '</span><b>' + esc(c[1]) + (c[2] ? '<small>' + esc(c[2]) + '</small>' : '') + '</b><em>' + esc(c[3]) + '</em></div>'; }).join('');
      box.hidden = false;
    },
    // main.js: the scene is built. Fill the bar, let the first frames render under it, then fade into the race.
    done: function (start) {
      if (ready || failed) { if (!failed) start(); return; }
      ready = true; clearInterval(tipTimer); requestAnimationFrame(tick);
      setTimeout(function () { root.classList.add('out'); start(); setTimeout(function () { root.hidden = true; }, 500); }, 700);
    },
  };
})();
</script>
