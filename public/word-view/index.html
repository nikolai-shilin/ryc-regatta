<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sailing dictionary view</title>
<!-- The sailing dictionary's pages' scene (app/[lang]/dictionary, components/word-scene.tsx embeds it): a word of
     sailing sailed on the water, as the race's dictionary shows it behind its panel (game/word-scenes.js), on a race
     of its own laid for it at the venue: a triangle for the wing mark, an upwind finish's course for the offset mark,
     a stream for the current. ?w= the word, ?lang= the tags' language; the page that holds it can send another word
     ({ type: 'word', id }), say what part of the scene its words leave clear ({ type: 'view', x, y, w, h }, as shares
     of the scene, x and y from its top left, 0 and 0 when left out, w 1: the word framed there), and say it has
     scrolled out of sight ({ type: 'away', on }). It tells the page when it is
     ready for them ({ type: 'ready' }) and when its first frame is up ({ type: 'live' }). -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity 0.8s ease; }
  canvas.live { opacity: 1; }
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three@0.160.0/build/three.module.min.js", "three/addons/": "/vendor/three@0.160.0/examples/jsm/" } }</script>
<!-- the land round the course (game/land.js, the venue's: venues.js landFiles): fetched at once, not after the modules
     that ask for it -->
<script>(function () { var v = 'gocek';
  try { v = new URLSearchParams(location.search).get('venue') || v; } catch (e) {}
  if (!/^[a-z-]+$/.test(v)) v = 'gocek';
  var f = v === 'gocek' ? ['/game/skopea.bin', '/game/skopea.json'] : ['/game/venues/' + v + '.bin', '/game/venues/' + v + '.json'];
  var map = {}; try { map = JSON.parse(document.querySelector('script[type=importmap]').textContent).imports; } catch (e) {}
  f.forEach(function (h) { var l = document.createElement('link'); l.rel = 'preload'; l.as = 'fetch'; l.href = map[h] || h; l.crossOrigin = 'anonymous'; document.head.appendChild(l); }); })();</script>
<!-- every module the page will load, asked for at once rather than an import at a time, and the yacht with them
     (game/yacht.js); npm test keeps the list in step with the imports -->
<link rel="preload" as="fetch" href="/game/yacht.glb" crossorigin>
<link rel="modulepreload" href="/game/world.js">

<body>
<canvas id="c" aria-hidden="true"></canvas>
<script type="module">
import { makeWorld } from '/game/world.js';
import { followSettings } from '/game/gfx.js';
import { Race } from '/game/sim.js';
import { createStage, sceneIds } from '/game/word-scenes.js';

const canvas = document.getElementById('c');
const q = new URLSearchParams(location.search);
const LANGS = ['en', 'ru', 'es', 'de', 'tr', 'fr', 'it', 'pt'];
const lang = LANGS.includes(q.get('lang')) ? q.get('lang') : 'en';
const ids = sceneIds();
const pick = (w) => (ids.includes(w) ? w : 'beat');
// the race a word is shown on: the same seed and breeze for every word, the course and the stream it needs
const raceFor = (w) => ({ course: w === 'wing-mark' ? 'tri' : w === 'offset-mark' ? 'wlu' : 'wl', current: w === 'current' });
const same = (a, b) => a.course === b.course && a.current === b.current;
const tell = (msg) => { try { parent.postMessage(msg, location.origin); } catch (e) {} };

async function start() {
  let world;
  try { world = await makeWorld(canvas); } catch (e) { return; } // no WebGL: the page's words stay as they are
  world.showGuides = false;
  const skipFrame = followSettings(world); // Audio & graphics: the level chosen, and the battery saver
  let race = null, laid = null, stage = null, word = pick(q.get('w')), ready = false, on = true, last = performance.now(), live = false;
  let clear = { x: 0, y: 0, w: 1, h: 1 };
  const view = () => stage?.view({ x: innerWidth * clear.x, y: innerHeight * clear.y, w: Math.max(1, innerWidth * clear.w), h: Math.max(1, innerHeight * clear.h) });

  async function show(w) {
    word = pick(w);
    const want = raceFor(word);
    if (!race || !same(laid, want)) {
      ready = false;
      if (stage) { stage.close(); stage = null; }
      laid = want;
      race = new Race({ preset: 'medium', fleet: 4, laps: 1, length: 'short', start: 1, seed: 4242, ...want });
      race.settings = { daily: null, daytime: 'afternoon' }; // world.setRace lights her by it (light.js pickSky)
      world.setRace(race);
      await world.ready();
      stage = createStage({ world, race, lang });
      view();
    }
    if (!stage.show(word) && word !== 'beat') stage.show('beat'); // (a word this race can't show: the beat)
    ready = true; last = performance.now();
  }

  addEventListener('message', (e) => {
    if (e.origin !== location.origin) return;
    if (e.data?.type === 'word' && typeof e.data.id === 'string') show(e.data.id);
    if (e.data?.type === 'away') { on = !e.data.on; last = performance.now(); }
    if (e.data?.type === 'view' && e.data.h > 0) {
      const f = (v, d) => (typeof v === 'number' && v >= 0 && v <= 1 ? v : d);
      clear = { x: f(e.data.x, 0), y: f(e.data.y, 0), w: f(e.data.w, 1) || 1, h: f(e.data.h, 1) };
      view();
    }
  });
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
  const size = () => { world.resize(innerWidth, innerHeight); view(); };
  size(); addEventListener('resize', size);
  tell({ type: 'ready' });
  await show(word);

  function loop(now) {
    requestAnimationFrame(loop);
    if (skipFrame(now)) return;
    if (!on || document.hidden || !ready) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    race.idle(dt); stage.frame(dt);
    world.frame(dt, race.t, dt);
    if (!live) { live = true; canvas.classList.add('live'); tell({ type: 'live' }); }
  }
  requestAnimationFrame(loop);
}

start();
</script>
</body>
</html>
