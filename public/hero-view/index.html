<title>Race view</title>
<!-- The home page's hero background (app/page.tsx embeds it): the game itself (public/game), a race already under way
     with every boat, yours included, sailed by the game's own skippers, seen from the drone as it slowly circles.
     Nothing to steer. It is today's race's venue and yacht (the home page asks for them: ?venue=, ?boat=, which the
     game's venues.js and classes.js read), lit at the time of day a race is set to (light.js DAYTIMES: morning,
     midday, afternoon, evening, sunset) nearest the venue's hour now. The page shows a still picture behind
     this until the first frame is drawn. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity 0.8s ease; }
  canvas.live { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { canvas { display: none; } }
</style>
<!-- the land round the course (game/land.js, the venue's: venues.js landFiles): fetched at once, not after the modules
     that ask for it -->
<script>(function () { var v = 'gocek';
  try { v = new URLSearchParams(location.search).get('venue') || v; } catch (e) {}
  if (!/^[a-z-]+$/.test(v)) v = 'gocek';
  var f = v === 'gocek' ? ['/game/skopea.bin', '/game/skopea.json'] : ['/game/venues/' + v + '.bin', '/game/venues/' + v + '.json'];
  f.forEach(function (h) { var l = document.createElement('link'); l.rel = 'preload'; l.as = 'fetch'; l.href = h; l.crossOrigin = 'anonymous'; document.head.appendChild(l); }); })();</script>

     (game/yacht.js); npm test keeps the list in step with the imports -->

<body>
<canvas id="c" aria-hidden="true"></canvas>
<script type="module">
import { World } from '/game/world.js';
import { followSettings } from '/game/gfx.js';
import { Race } from '/game/sim.js';
import { VENUE } from '/game/venues.js';
import { DAYTIMES } from '/game/light.js';

// the time of day a race is set to that is nearest the venue's clock now (venues.js tz), round the clock: a night there
// is its sunset till the small hours, then its morning
function daytimeNow() {
  const n = new Date(), h = n.getUTCHours() + n.getUTCMinutes() / 60 + VENUE.tz;
  const off = (d) => { const x = (((h - DAYTIMES[d]) % 24) + 24) % 24; return Math.min(x, 24 - x); };
  return Object.keys(DAYTIMES).reduce((a, b) => (off(b) < off(a) ? b : a));
}

const canvas = document.getElementById('c');
const STEP = 1 / 60;

function start() {
  let world;
  try { world = new World(canvas); } catch (e) { return; } // no WebGL: the page's picture stays
  world.showGuides = false;
  const skipFrame = followSettings(world); // Audio & graphics: the level chosen, and the battery saver

  let race, ready = false, last = performance.now(), acc = 0;
  function newRace() {
    ready = false;
    race = new Race({ preset: 'medium', fleet: 5, laps: 1, length: 'short', start: 1, seed: 4242 + Math.floor(Math.random() * 50) });
    race.settings = { daily: null, daytime: daytimeNow() }; // world.setRace lights her by it (light.js pickSky)
    world.setRace(race); // first: the world dresses your boat in your colours because she has no skipper yet
    const P = race.player;
    P.autoTrim = true; P.crew = 0.2;
    P.ai = { skill: 0.97, lineT: 0.5, lastTack: -999, go: false, mean: race.wind.dir(), dirtyT: 0, hailT: -99, wp: 0, loiter: 1, port: false, dare: 0 };
    world.resetView(); world.dist = 36; world.orbit = 0.9;
    // sailed on to just past the gun: the fleet off the line and up the first beat. That is ~1200 steps, seconds of work
    // on a phone, and this frame shares the home page's thread, so it goes in slices of a few ms: the page stays live.
    const r = race;
    (function warm() {
      if (r !== race) return;
      const end = performance.now() + 6;
      while (r.clock < 20 && performance.now() < end) r.step(STEP);
      if (r.clock < 20) setTimeout(warm, 0);
      else world.ready().then(() => { if (r === race) { ready = true; last = performance.now(); acc = 0; } }); // and the shaders compiled alongside
    })();
  }
  newRace();

  const size = () => world.resize(innerWidth, innerHeight);
  size(); addEventListener('resize', size);

  // draw only while the hero is on screen (the observer's root is the page's viewport, not this frame's)
  let on = true;
  new IntersectionObserver(([e]) => { on = e.isIntersecting; last = performance.now(); }).observe(document.documentElement);
  document.addEventListener('visibilitychange', () => { last = performance.now(); });

  function loop(now) {
    requestAnimationFrame(loop);
    if (skipFrame(now)) return;
    if (!on || document.hidden || !ready) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    acc += dt;
    while (acc >= STEP) { race.step(STEP); acc -= STEP; }
    if (race.player.done || race.clock > 600) { newRace(); return; } // the last frame stays up while the next one warms
    world.orbit += dt * 0.035; // the drone drifts round her
    world.frame(dt, race.t);
    canvas.classList.add('live');
  }
  requestAnimationFrame(loop);
}

if (!matchMedia('(prefers-reduced-motion: reduce)').matches) start();
</script>
</body>
