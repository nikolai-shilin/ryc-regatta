<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Regatta · Sailing Certification Test</title>
<meta name="description" content="A 3D sailing game: race a yacht round a windward–leeward course against three boats, in light, medium or strong wind.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b3550">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --st: max(env(safe-area-inset-top), calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)));
    --sb: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));
    --sl: max(env(safe-area-inset-left), var(--tg-safe-area-inset-left, 0px));
    --sr: max(env(safe-area-inset-right), var(--tg-safe-area-inset-right, 0px));
    --accent: #35b0f2; --ok: #2ecc71; --warn: #ffb020; --bad: #ff4d3d;
    --glass: rgba(6, 22, 34, 0.42); --line: rgba(255, 255, 255, 0.7);
    font-family: 'Carlito', 'Lato', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b3550; color: #fff; overscroll-behavior: none; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .pill { background: var(--glass); border-radius: 12px; padding: 4px 9px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-weight: 700; font-size: 13px; text-shadow: 0 1px 2px rgba(0,0,0,.4); }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud[hidden] { display: none; }
  #hud > * { position: absolute; }
  .tl { left: calc(10px + var(--sl)); top: calc(8px + var(--st)); display: flex; gap: 8px; align-items: flex-start; }
  #inst { width: 74px; height: 74px; border-radius: 50%; background: var(--glass); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .tl .col { display: flex; flex-direction: column; gap: 6px; }
  #heel { width: 74px; }
  .tc { left: 50%; transform: translateX(-50%); top: calc(6px + var(--st)); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .speed { font-weight: 900; font-size: 34px; line-height: 1; text-shadow: 0 2px 6px rgba(0,0,0,.45); font-variant-numeric: tabular-nums; }
  .speed small { font-size: 14px; font-weight: 700; margin-left: 3px; opacity: .85; }
  #status { white-space: nowrap; font-variant-numeric: tabular-nums; }
  #status.bad { background: rgba(200, 40, 30, .75); }
  .trim { display: flex; align-items: center; gap: 6px; }
  .trim i { display: block; width: 26px; height: 4px; border-radius: 2px; background: var(--ok); transition: transform .15s, background .15s; }
  .trim[data-s="in"] i:first-child { background: var(--bad); transform: rotate(-35deg); }
  .trim[data-s="out"] i:last-child { background: var(--bad); transform: rotate(30deg); }
  .trim[data-s="irons"] i { background: var(--bad); transform: rotate(60deg); }
  .trim span { font-size: 12px; }
  .tr { right: calc(10px + var(--sr)); top: calc(8px + var(--st)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .tr .row { display: flex; gap: 6px; pointer-events: auto; }
  .seg { display: flex; border-radius: 12px; overflow: hidden; background: var(--glass); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .seg button { background: none; border: 0; padding: 6px 11px; font-weight: 700; font-size: 13px; }
  .seg button.on { background: rgba(255,255,255,.9); color: #0b2638; }
  .icon-btn { width: 32px; height: 30px; border: 0; border-radius: 12px; background: var(--glass); font-weight: 900; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #mini { width: 118px; height: 118px; border-radius: 14px; background: rgba(6, 30, 46, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  /* controls: rudder (left thumb), sheet + tack (right thumb) */
  #rudderZone { left: 0; bottom: 0; width: 42%; height: 58%; pointer-events: auto; touch-action: none; }
  #rudder { position: absolute; left: calc(14px + var(--sl)); bottom: calc(10px + var(--sb)); width: 210px; height: 118px; pointer-events: none; }
  #rudder .lbl { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 11px; font-weight: 700; opacity: .8; text-transform: uppercase; letter-spacing: .06em; }
  #sheetZone { right: calc(0px + var(--sr)); bottom: calc(10px + var(--sb)); width: 76px; height: min(300px, calc(100% - 196px - var(--st) - var(--sb))); pointer-events: auto; touch-action: none; display: flex; justify-content: center; }
  #sheet { position: relative; width: 22px; height: calc(100% - 22px); border-radius: 12px; background: rgba(255,255,255,.22); border: 2px solid var(--line); margin-top: 0; }
  #sheet .band { position: absolute; left: 0; right: 0; background: rgba(46, 204, 113, .6); border-radius: 4px; }
  #sheet .knob { position: absolute; left: -9px; width: 36px; height: 18px; border-radius: 9px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); transform: translateY(-50%); }
  #sheet .cap { position: absolute; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; opacity: .8; white-space: nowrap; text-transform: uppercase; letter-spacing: .05em; }
  #sheet .cap.t { top: -18px; } #sheet .cap.b { bottom: -18px; }
  #sheetZone.auto #sheet { opacity: .55; }
  .round { width: 66px; height: 66px; border-radius: 50%; border: 2px solid var(--line); background: rgba(255,255,255,.16); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); font-weight: 900; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; pointer-events: auto; touch-action: none; }
  .round:active, .round.down { background: rgba(255,255,255,.45); }
  #tackBtn { right: calc(92px + var(--sr)); bottom: calc(18px + var(--sb)); }
  #kiteBtn { right: calc(92px + var(--sr)); bottom: calc(96px + var(--sb)); width: 54px; height: 54px; font-size: 10px; }
  #kiteBtn.on { background: rgba(29, 111, 209, .75); }
  #kiteBtn[hidden] { display: none; }
  #toast { left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 20px; font-weight: 900; text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,.6); opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #count { left: 50%; top: 22%; transform: translateX(-50%); font-size: 72px; font-weight: 900; text-shadow: 0 3px 12px rgba(0,0,0,.5); font-variant-numeric: tabular-nums; }

  /* ---------- menus ---------- */
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: calc(12px + var(--st)) calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sl)); background: rgba(4, 20, 32, .35); }
  .overlay[hidden] { display: none; }
  .card { width: min(560px, 100%); max-height: 100%; overflow: auto; background: rgba(8, 26, 40, .82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 22px; padding: 20px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.35); touch-action: pan-y; }
  .card h1 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -.01em; }
  .card .sub { margin: 2px 0 14px; opacity: .8; font-size: 15px; }
  .card .grid { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; }
  .card .k { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; opacity: .75; }
  .choice { display: flex; flex-wrap: wrap; gap: 6px; }
  .choice button { border: 1.5px solid rgba(255,255,255,.35); background: transparent; border-radius: 12px; padding: 7px 12px; font-weight: 700; font-size: 14px; }
  .choice button.on { background: #fff; color: #0b2638; border-color: #fff; }
  .go { display: block; width: 100%; margin-top: 16px; border: 0; border-radius: 14px; padding: 13px; font-size: 18px; font-weight: 900; background: var(--accent); color: #00131f; }
  .go[hidden] { display: none; }
  .go.ghost { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.4); margin-top: 8px; font-size: 16px; padding: 10px; }
  .how { margin: 14px 0 0; padding: 0; list-style: none; font-size: 14px; line-height: 1.4; opacity: .9; display: grid; gap: 4px; }
  .how b { color: #9fdcff; }
  .back { display: inline-block; margin-top: 12px; color: #9fdcff; text-decoration: none; font-size: 14px; }
  .rotate { margin-top: 10px; font-size: 13px; color: var(--warn); display: none; }
  @media (orientation: portrait) { .rotate { display: block; } }
  table.res { width: 100%; border-collapse: collapse; margin: 6px 0 0; font-size: 16px; font-variant-numeric: tabular-nums; }
  table.res td { padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,.12); }
  table.res tr.me td { color: #9fdcff; font-weight: 900; }
  table.res td:last-child { text-align: right; }
  .res-wrap { display: grid; grid-template-columns: 1fr 150px; gap: 14px; align-items: start; }
  #track { width: 150px; height: 150px; border-radius: 12px; background: rgba(6, 30, 46, .7); }
  @media (max-width: 520px) { .res-wrap { grid-template-columns: 1fr; } }
  /* a phone on its side: the menu in two columns so it fits without scrolling */
  @media (orientation: landscape) and (max-height: 560px) {
    #menu .card { width: min(820px, 100%); padding: 16px 20px; }
    #menu .cols { display: grid; grid-template-columns: 1.15fr 1fr; gap: 22px; align-items: start; }
    #menu .how { margin: 4px 0 0; font-size: 13px; }
    #menu h1 { font-size: 26px; } #menu .sub { font-size: 14px; margin-bottom: 10px; }
    #menu .go { margin-top: 12px; padding: 11px; }
    .choice button { padding: 6px 10px; font-size: 13px; }
  }

  /* phones held upright: smaller instruments, controls still under the thumbs */
  @media (orientation: portrait) {
    .tl { flex-direction: column; } #inst { width: 62px; height: 62px; } #heel { width: 62px; }
    .speed { font-size: 28px; } #mini { width: 96px; height: 96px; }
    .tc { top: calc(48px + var(--st)); }
    #rudderZone { width: 55%; height: 40%; } #rudder { width: 180px; height: 100px; }
    #sheetZone { height: min(36%, 260px); }
  }
  @media (max-height: 380px) { #mini { width: 92px; height: 92px; } .speed { font-size: 28px; } #inst { width: 62px; height: 62px; } #heel { width: 62px; } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" hidden>
  <div class="tl">
    <svg id="inst" viewBox="-50 -50 100 100" aria-label="wind">
      <circle r="44" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
      <path d="M-33.7 -28.3 A44 44 0 0 1 -22 -38.1" stroke="rgba(255,77,61,.85)" stroke-width="5" fill="none"/>
      <path d="M22 -38.1 A44 44 0 0 1 33.7 -28.3" stroke="rgba(46,204,113,.85)" stroke-width="5" fill="none"/>
      <path d="M0 -20 C6 -10 7 6 5 18 L-5 18 C-7 6 -6 -10 0 -20Z" fill="#fff"/>
      <g id="windArrow"><path d="M0 -46 L-7 -32 L-2 -32 L-2 -24 L2 -24 L2 -32 L7 -32Z" fill="#ffd400" transform="rotate(180 0 -35)"/></g>
      <text id="twsTxt" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#fff"></text>
    </svg>
    <div class="col">
      <svg id="heel" viewBox="-40 -6 80 40">
        <path d="M-32 0 A32 32 0 0 0 32 0" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="6"/>
        <path d="M-32 0 A32 32 0 0 0 -18.4 26.2" fill="none" stroke="rgba(255,77,61,.8)" stroke-width="6"/>
        <path d="M32 0 A32 32 0 0 1 18.4 26.2" fill="none" stroke="rgba(255,77,61,.8)" stroke-width="6"/>
        <line id="heelNeedle" x1="0" y1="0" x2="0" y2="32" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <text id="heelTxt" x="0" y="-0.5" text-anchor="middle" font-size="9" font-weight="700" fill="#fff"></text>
      </svg>
    </div>
  </div>
  <div class="tc">
    <div class="speed"><b id="spd">0.0</b><small data-t="kn"></small></div>
    <div class="pill" id="status"></div>
    <div class="trim pill" id="trim"><i></i><i></i><span id="trimTxt"></span></div>
  </div>
  <div class="tr">
    <div class="row">
      <div class="seg" id="camSeg"><button data-cam="drone" data-t="drone"></button><button data-cam="helm" data-t="helm"></button></div>
      <button class="icon-btn" id="pauseBtn" aria-label="pause">II</button>
    </div>
    <canvas id="mini" width="236" height="236"></canvas>
  </div>
  <div id="rudderZone">
    <svg id="rudder" viewBox="0 0 210 118">
      <path d="M22 104 A84 84 0 0 1 188 104" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="16" stroke-linecap="round"/>
      <path d="M22 104 A84 84 0 0 1 188 104" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2" stroke-dasharray="2 10"/>
      <circle id="rudderKnob" cx="105" cy="20" r="14" fill="#fff"/>
    </svg>
  </div>
  <div id="sheetZone"><div id="sheet"><div class="band"></div><div class="knob"></div><span class="cap t" data-t="in"></span><span class="cap b" data-t="out"></span></div></div>
  <button class="round" id="tackBtn"></button>
  <button class="round" id="kiteBtn" hidden data-t="kite"></button>
  <div id="toast"></div>
  <div id="count"></div>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <div class="cols"><div>
    <h1 data-t="title"></h1>
    <p class="sub" data-t="sub"></p>
    <div class="grid">
      <span class="k" data-t="wind"></span>
      <div class="choice" data-opt="preset"><button data-v="light" data-t="light"></button><button data-v="medium" data-t="medium"></button><button data-v="strong" data-t="strong"></button></div>
      <span class="k" data-t="laps"></span>
      <div class="choice" data-opt="laps"><button data-v="1">1</button><button data-v="2">2</button></div>
      <span class="k" data-t="sails"></span>
      <div class="choice" data-opt="autoTrim"><button data-v="0" data-t="manual"></button><button data-v="1" data-t="auto"></button></div>
      <span class="k" data-t="sound"></span>
      <div class="choice" data-opt="sound"><button data-v="1" data-t="on"></button><button data-v="0" data-t="off"></button></div>
    </div>
    <button class="go" id="goBtn" data-t="start"></button>
    <button class="go ghost" id="resumeBtn" hidden data-t="resume"></button>
    </div><div>
    <ul class="how">
      <li data-t="how1"></li><li data-t="how2"></li><li data-t="how3"></li><li data-t="how4"></li>
    </ul>
    <p class="rotate" data-t="rotate"></p>
    <a class="back" id="backLink" href="/" data-t="back"></a>
    </div></div>
  </div>
</div>

<div class="overlay" id="results" hidden>
  <div class="card">
    <h1 id="resTitle"></h1>
    <div class="res-wrap">
      <table class="res" id="resTable"></table>
      <canvas id="track" width="300" height="300"></canvas>
    </div>
    <button class="go" id="againBtn" data-t="again"></button>
    <button class="go ghost" id="menuBtn" data-t="menu"></button>
  </div>
</div>

<noscript>The game needs JavaScript and WebGL.</noscript>
<script type="module" src="/regatta/main.js"></script>
</body>
</html>
