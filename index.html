<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Regatta · Sailing Certification Test</title>
<meta name="description" content="A 3D sailing game: race a yacht round a windward–leeward course against three boats, in light, medium or strong wind.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* The app's own look (docs/design/app.css): Merriweather Light display, uppercase Carlito kickers, one blue accent,
     black-on-white chips and pills; the night theme on a black ground. Red and yellow only for warnings and flags. */
  :root {
    --st: max(env(safe-area-inset-top), calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)));
    --sb: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));
    --sl: max(env(safe-area-inset-left), var(--tg-safe-area-inset-left, 0px));
    --sr: max(env(safe-area-inset-right), var(--tg-safe-area-inset-right, 0px));
    --bg: #ffffff; --ink: #000000; --muted: #6d7a7e; --faint: #b8c2c6; --band: #f2f7f9; --line: #eef2f4; --tag-line: #dfe5e8;
    --accent: #0290d7; --on-accent: #ffffff; --sel-bg: #000000; --sel-ink: #ffffff; --danger: #d40000; --warn: #ffa800;
    --scrim: rgba(0, 0, 0, 0.35); --shadow: rgba(0, 0, 0, 0.18); --glass: rgba(255, 255, 255, 0.9);
    --serif: 'Merriweather', Georgia, serif; --sans: 'Carlito', 'Lato', Arial, sans-serif;
  }
  .theme-night {
    --bg: #000000; --ink: #ffffff; --muted: #a8b9c9; --faint: #5c6f80; --band: #14191e; --line: #1f2830; --tag-line: #43586b;
    --accent: #35b0f2; --on-accent: #00131f; --sel-bg: #ffffff; --sel-ink: #000000; --danger: #ff6a5c;
    --scrim: rgba(0, 0, 0, 0.6); --shadow: rgba(0, 0, 0, 0.6); --glass: rgba(0, 0, 0, 0.82);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b3550; color: var(--ink); overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
  body { font-family: var(--serif); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .kicker { font-family: var(--sans); font-weight: 700; font-size: 13px; letter-spacing: -0.02em; text-transform: uppercase; color: var(--ink); }
  .meta { font-family: var(--sans); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--muted); }
  /* text over the sea, as the app's text on photos */
  .on-photo { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6), 0 2px 14px rgba(0,0,0,.55); }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: var(--sans); }
  #hud[hidden] { display: none; }
  #hud > * { position: absolute; }
  .chip-ui { background: var(--glass); color: var(--ink); border-radius: 54px; padding: 0 12px; height: 28px; display: inline-flex; align-items: center; gap: 8px; font-family: var(--sans); font-weight: 700; font-size: 13px; white-space: nowrap; box-shadow: 0 2px 10px rgba(0,0,0,.12); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-variant-numeric: tabular-nums; }
  .tl { left: calc(12px + var(--sl)); top: calc(10px + var(--st)); display: flex; gap: 8px; align-items: flex-start; }
  #inst { width: 76px; height: 76px; border-radius: 50%; background: var(--glass); box-shadow: 0 2px 10px rgba(0,0,0,.15); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #inst .ring { fill: none; stroke: var(--tag-line); stroke-width: 1.5; }
  #inst .port { stroke: var(--danger); } #inst .stbd { stroke: #1aa39a; }
  #inst .hull { fill: var(--ink); } #inst .tw { fill: var(--muted); } #inst .aw { fill: var(--accent); }
  #inst text { font-family: var(--sans); font-weight: 700; font-size: 10px; }
  .tl .col { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  #heel { width: 76px; height: 38px; border-radius: 0 0 40px 40px; background: var(--glass); box-shadow: 0 2px 10px rgba(0,0,0,.12); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #heel .arc { fill: none; stroke: var(--tag-line); stroke-width: 5; } #heel .red { fill: none; stroke: var(--danger); stroke-width: 5; }
  #heel text { font-family: var(--sans); font-weight: 700; font-size: 9px; fill: var(--ink); }
  #heelNeedle { stroke: var(--ink); }
  .tc { left: 50%; transform: translateX(-50%); top: calc(6px + var(--st)); display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .speed { font-family: var(--serif); font-weight: 300; font-size: 40px; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .speed small { font-family: var(--sans); font-weight: 700; font-size: 13px; text-transform: uppercase; margin-left: 4px; letter-spacing: 0.02em; }
  #status.bad { background: var(--danger); color: #fff; }
  .perf { font-family: var(--sans); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .perf:empty, .chips:empty { display: none; }
  .trim i { display: block; width: 22px; height: 4px; border-radius: 2px; background: var(--ink); transition: transform .15s, background .15s; }
  .trim[data-s="in"] i:first-child { background: var(--danger); transform: rotate(-35deg); }
  .trim[data-s="out"] i:last-child { background: var(--danger); transform: rotate(30deg); }
  .trim[data-s="irons"] i { background: var(--danger); transform: rotate(60deg); }
  .chips { display: flex; gap: 6px; }
  .chip { font-family: var(--sans); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; height: 26px; display: inline-flex; align-items: center; padding: 0 11px; border-radius: 54px; background: var(--glass); color: var(--ink); white-space: nowrap; }
  .chip.bad { background: var(--danger); color: #fff; } .chip.warn { background: var(--warn); color: #000; } .chip.ok { background: var(--accent); color: var(--on-accent); }
  /* the committee boat's flags, big in the centre while the start sequence runs (and X while anyone is over early) */
  .flags { display: flex; gap: 14px; padding: 8px 14px 6px; border-radius: 16px; background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .flags:empty { display: none; }
  .flags figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .flags figcaption { font-family: var(--sans); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: #fff; white-space: nowrap; }
  .flag { display: block; width: 54px; height: 36px; border-radius: 2px; position: relative; box-shadow: 0 2px 6px rgba(0,0,0,.45); font-style: normal; transform-origin: left center; animation: flutter 1.4s ease-in-out infinite alternate; }
  .flags figure:nth-child(2) .flag { animation-delay: -.5s; } .flags figure:nth-child(3) .flag { animation-delay: -.9s; }
  @keyframes flutter { from { transform: perspective(120px) rotateY(-12deg) skewY(-2deg); } to { transform: perspective(120px) rotateY(10deg) skewY(2deg); } }
  .flag.cls { background: #f2c230; color: #111; font: 900 24px/36px var(--sans); text-align: center; }
  .flag.P { background: #1f4fa8; } .flag.P::after { content: ''; position: absolute; inset: 11px 18px; background: #fff; }
  .flag.X { background: linear-gradient(#1f4fa8, #1f4fa8) center / 11px 100% no-repeat, linear-gradient(#1f4fa8, #1f4fa8) center / 100% 9px no-repeat, #fff; }
  @media (max-height: 420px) { .flag { width: 44px; height: 29px; } .flag.cls { font-size: 20px; line-height: 29px; } .flag.P::after { inset: 9px 15px; } .flags { padding: 6px 12px 5px; gap: 12px; } }
  .tr { right: calc(12px + var(--sr)); top: calc(10px + var(--st)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .tr .row { display: flex; gap: 6px; pointer-events: auto; align-items: center; }
  /* camera: the app's tags, the chosen one black */
  .seg { display: flex; gap: 6px; }
  .seg button { height: 32px; padding: 0 14px; border-radius: 54px; border: 2px solid var(--tag-line); background: var(--bg); color: var(--ink); font-family: var(--serif); font-size: 14px; line-height: 1; }
  .seg button.on { background: var(--sel-bg); border-color: var(--sel-bg); color: var(--sel-ink); }
  .round-s { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent); background: var(--bg); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  #mini { width: 120px; height: 120px; border-radius: 22px; background: var(--glass); box-shadow: 0 2px 10px rgba(0,0,0,.15); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

  /* controls: rudder (left thumb), sheet + tack (right thumb) */
  #rudderZone { left: 0; bottom: 0; width: 42%; height: 58%; pointer-events: auto; touch-action: none; }
  #rudder { position: absolute; left: calc(14px + var(--sl)); bottom: calc(10px + var(--sb)); width: 210px; height: 118px; pointer-events: none; }
  #rudder .track { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 16; stroke-linecap: round; }
  #rudder .ticks { fill: none; stroke: rgba(0,0,0,.25); stroke-width: 2; stroke-dasharray: 2 10; }
  #rudderKnob { fill: var(--accent); stroke: #fff; stroke-width: 3; }
  #sheetZone { right: calc(0px + var(--sr)); bottom: calc(10px + var(--sb)); width: 80px; height: min(300px, calc(100% - 200px - var(--st) - var(--sb))); pointer-events: auto; touch-action: none; display: flex; justify-content: center; }
  #sheet { position: relative; width: 24px; height: calc(100% - 22px); border-radius: 54px; background: var(--glass); border: 2px solid var(--tag-line); box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  #sheet .band { position: absolute; left: 2px; right: 2px; background: color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 54px; }
  #sheet .knob { position: absolute; left: -10px; width: 40px; height: 20px; border-radius: 54px; background: var(--accent); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); transform: translateY(-50%); }
  #sheet .cap { position: absolute; left: 50%; transform: translateX(-50%); font-family: var(--sans); font-size: 11px; font-weight: 700; white-space: nowrap; text-transform: uppercase; letter-spacing: .02em; }
  #sheet .cap.t { top: -19px; } #sheet .cap.b { bottom: -19px; }
  #sheetZone.auto #sheet { opacity: .55; }
  /* the app's round buttons: accent ring, filled while pressed */
  .round { width: 68px; height: 68px; border-radius: 50%; border: 2px solid var(--accent); background: var(--bg); color: var(--accent); font-family: var(--sans); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; pointer-events: auto; touch-action: none; box-shadow: 0 2px 10px rgba(0,0,0,.18); padding: 0; }
  .round:active, .round.down, #kiteBtn.on { background: var(--accent); color: var(--on-accent); }
  #tackBtn { right: calc(94px + var(--sr)); bottom: calc(18px + var(--sb)); }
  #kiteBtn { right: calc(94px + var(--sr)); bottom: calc(98px + var(--sb)); width: 56px; height: 56px; font-size: 10px; }
  #kiteBtn[hidden] { display: none; }
  #toast { left: 50%; top: 42%; transform: translate(-50%, -50%); max-width: calc(100% - 40px); background: var(--bg); color: var(--ink); border-radius: 28px; padding: 12px 20px; font-family: var(--serif); font-size: 16px; line-height: 1.3; text-align: center; box-shadow: 0 8px 30px var(--shadow); opacity: 0; transition: opacity .3s; }
  #toast.show { opacity: 1; }
  #count { left: 50%; top: 22%; transform: translateX(-50%); font-family: var(--serif); font-weight: 300; font-size: 84px; line-height: 1; font-variant-numeric: tabular-nums; }

  /* ---------- the sailing HUD: its own look — dark glass, half transparent, compact (whatever the app's theme) ---------- */
  #hud {
    --bg: rgba(8, 14, 20, 0.5); --glass: rgba(8, 14, 20, 0.46); --ink: #ffffff; --muted: rgba(255, 255, 255, 0.66); --faint: rgba(255, 255, 255, 0.32);
    --tag-line: rgba(255, 255, 255, 0.2); --accent: #35b0f2; --on-accent: #00131f; --sel-bg: rgba(255, 255, 255, 0.86); --sel-ink: #0b1218;
    --danger: #ff6a5c; --warn: #ffb020; --shadow: rgba(0, 0, 0, 0.25);
  }
  #hud .chip-ui, #hud #inst, #hud #heel, #hud #mini, #hud #sheet, #hud .round, #hud .seg button, #hud .round-s, #hud #toast { box-shadow: none; }
  #hud .chip-ui { height: 24px; padding: 0 10px; font-size: 12px; gap: 6px; }
  #hud .chip { height: 22px; padding: 0 9px; font-size: 11px; }
  #hud .chip.warn { background: rgba(255, 176, 32, 0.85); }
  #hud .trim i { width: 18px; height: 3px; }
  #hud .speed { font-size: 32px; }
  #hud .speed small { font-size: 11px; }
  #hud .perf { font-size: 11px; }
  #hud .tc { gap: 4px; }
  #hud #inst { width: 62px; height: 62px; }
  #hud #heel { width: 62px; height: 31px; }
  #hud .tl { gap: 6px; } #hud .tr { gap: 6px; }
  #hud .seg button { height: 28px; padding: 0 11px; font-family: var(--sans); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; border-width: 1.5px; }
  #hud .round-s { width: 30px; height: 30px; border: 1.5px solid var(--tag-line); color: #fff; background: var(--bg); }
  #hud .round-s svg { width: 11px; height: 11px; }
  #hud #mini { width: 100px; height: 100px; border-radius: 16px; }
  #hud .tr .row { align-items: flex-start; }
  #hud .zoom { display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
  #hud .zoom button { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--tag-line); background: var(--bg); color: #fff; font-family: var(--sans); font-weight: 700; font-size: 20px; line-height: 1; padding: 0; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); touch-action: none; }
  #hud .zoom button:active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  #hud #rudder { width: 170px; height: 96px; }
  #hud #rudder .track { stroke: rgba(8, 14, 20, 0.42); stroke-width: 14; }
  #hud #rudder .ticks { stroke: rgba(255, 255, 255, 0.35); }
  #hud #rudderKnob { stroke: rgba(255, 255, 255, 0.85); stroke-width: 2.5; }
  #hud #sheetZone { width: 64px; }
  #hud #sheet { width: 18px; border-width: 1.5px; }
  #hud #sheet .knob { left: -8px; width: 30px; height: 16px; border-width: 1.5px; }
  #hud #sheet .cap { font-size: 10px; }
  #hud .round { width: 56px; height: 56px; font-size: 11px; border-width: 1.5px; color: #fff; border-color: rgba(53, 176, 242, 0.85); }
  #hud #tackBtn { right: calc(76px + var(--sr)); bottom: calc(16px + var(--sb)); }
  #hud #kiteBtn { right: calc(76px + var(--sr)); bottom: calc(82px + var(--sb)); width: 46px; height: 46px; font-size: 9px; }
  #hud #toast { font-family: var(--sans); font-weight: 700; font-size: 14px; padding: 9px 16px; border-radius: 18px; background: rgba(8, 14, 20, 0.62); color: #fff; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #hud #count { font-size: 68px; }
  @media (orientation: portrait) {
    #hud #inst { width: 56px; height: 56px; } #hud #heel { width: 56px; height: 28px; } #hud .speed { font-size: 28px; } #hud #mini { width: 88px; height: 88px; }
    #hud .tc { top: calc(132px + var(--st)); } #hud #rudder { width: 160px; height: 90px; }
  }

  /* ---------- menus: the app's sheet ---------- */
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: calc(12px + var(--st)) calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sl)); background: var(--scrim); }
  .overlay[hidden] { display: none; }
  .card { width: min(560px, 100%); max-height: 100%; overflow: auto; background: var(--bg); color: var(--ink); border-radius: 28px; padding: 22px 24px 24px; box-shadow: 0 12px 40px var(--shadow); touch-action: pan-y; }
  .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .logo { display: block; width: 50px; height: 25px; }
  .theme-night .logo { filter: invert(1); }
  .card h1 { margin: 0; font-family: var(--serif); font-weight: 300; font-size: 40px; line-height: 0.95; letter-spacing: -0.025em; }
  .card .sub { margin: 10px 0 18px; font-size: 15px; line-height: 1.45; color: var(--muted); }
  .card .grid { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; }
  .choice { display: flex; flex-wrap: wrap; gap: 6px; }
  .choice button { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 54px; border: 2px solid var(--tag-line); background: var(--bg); color: var(--ink); font-family: var(--serif); font-size: 15px; line-height: 1; }
  .choice button.on { background: var(--sel-bg); border-color: var(--sel-bg); color: var(--sel-ink); }
  .go { display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; margin-top: 18px; border-radius: 54px; border: 2px solid var(--accent); background: var(--accent); color: var(--on-accent); font-family: var(--serif); font-size: 20px; line-height: 1; }
  .go[hidden] { display: none; }
  .go.ghost { background: var(--bg); color: var(--ink); border-color: var(--tag-line); height: 52px; font-size: 18px; margin-top: 10px; }
  .how { margin: 16px 0 0; padding: 14px 16px; list-style: none; background: var(--band); border-radius: 22px; font-family: var(--sans); font-size: 14px; line-height: 1.35; color: var(--muted); display: grid; gap: 6px; }
  .how b { color: var(--ink); }
  .back { display: inline-block; margin-top: 14px; color: var(--accent); text-decoration: none; font-size: 15px; }
  .rotate { margin-top: 10px; font-family: var(--sans); font-weight: 700; font-size: 13px; color: var(--danger); display: none; }
  @media (orientation: portrait) { .rotate { display: block; } }
  table.res { width: 100%; border-collapse: collapse; margin: 14px 0 0; font-family: var(--sans); font-size: 17px; font-variant-numeric: tabular-nums; }
  table.res td { padding: 9px 4px; border-bottom: 1px solid var(--line); }
  table.res td:first-child { color: var(--muted); width: 28px; }
  table.res tr.me td { color: var(--accent); font-weight: 700; }
  table.res td:last-child { text-align: right; }
  .res-wrap { display: grid; grid-template-columns: 1fr 156px; gap: 16px; align-items: start; }
  #track { width: 156px; height: 156px; border-radius: 22px; background: var(--band); margin-top: 14px; }
  @media (max-width: 520px) { .res-wrap { grid-template-columns: 1fr; } }
  /* a phone on its side: the menu in two columns so it fits without scrolling */
  @media (orientation: landscape) and (max-height: 560px) {
    #menu .card { width: min(840px, 100%); padding: 16px 20px 18px; }
    #menu .cols { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: start; }
    #menu .card-top { margin-bottom: 8px; }
    #menu h1 { font-size: 30px; } #menu .sub { font-size: 13px; margin: 6px 0 10px; }
    #menu .grid { gap: 5px 12px; }
    .choice button { height: 31px; padding: 0 11px; font-size: 13px; }
    #menu .go { margin-top: 0; height: 50px; font-size: 18px; } #menu .go.ghost { margin-top: 8px; height: 44px; font-size: 16px; }
    #menu .how { margin-top: 12px; padding: 10px 14px; font-size: 13px; gap: 4px; }
    #results .card { width: min(720px, 100%); }
  }
  @media (orientation: landscape) and (max-height: 430px) {
    #menu .card-top { margin-bottom: 2px; } #menu h1 { font-size: 26px; } #menu .sub { display: none; }
    #menu .grid { margin-top: 10px; gap: 4px 12px; } .choice button { height: 29px; }
  }

  /* phones held upright: smaller instruments, controls still under the thumbs */
  @media (orientation: portrait) {
    .tl { flex-direction: column; } #inst { width: 64px; height: 64px; } #heel { width: 64px; height: 32px; }
    .speed { font-size: 32px; } #mini { width: 98px; height: 98px; }
    .tc { top: calc(150px + var(--st)); } #status { font-size: 12px; }
    #rudderZone { width: 55%; height: 40%; } #rudder { width: 180px; height: 100px; }
    #sheetZone { height: min(36%, 260px); }
  }
  @media (max-height: 380px) { #mini { width: 94px; height: 94px; } .speed { font-size: 32px; } #inst { width: 64px; height: 64px; } #heel { width: 64px; height: 32px; } }
</style>

<body>
<canvas id="gl"></canvas>

<div id="hud" hidden>
  <div class="tc">
    <div class="speed on-photo"><span id="spd">0.0</span><small data-t="kn"></small></div>
    <div class="chip-ui" id="status"></div>
    <div class="flags" id="flags"></div>
    <div class="perf on-photo" id="perf"></div>
    <div class="trim chip-ui" id="trim"><i></i><i></i><span id="trimTxt"></span></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="tr">
    <div class="row">
      <div class="seg" id="camSeg"><button data-cam="drone" data-t="drone" title="X"></button><button data-cam="top" data-t="top" title="C"></button><button data-cam="helm" data-t="helm" title="V"></button></div>
      <button class="round-s" id="pauseBtn" aria-label="pause"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="2" y="1" width="3.5" height="12" rx="1.2" fill="currentColor"/><rect x="8.5" y="1" width="3.5" height="12" rx="1.2" fill="currentColor"/></svg></button>
    </div>
    <div class="row">
      <div class="zoom"><button id="zoomIn" aria-label="zoom in (A)" title="Zoom in · A">+</button><button id="zoomOut" aria-label="zoom out (Z)" title="Zoom out · Z">−</button></div>
      <canvas id="mini" width="240" height="240"></canvas>
    </div>
  </div>
  <div id="rudderZone">
    <svg id="rudder" viewBox="0 0 210 118">
      <path class="track" d="M22 104 A84 84 0 0 1 188 104"/>
      <path class="ticks" d="M22 104 A84 84 0 0 1 188 104"/>
      <circle id="rudderKnob" cx="105" cy="20" r="14"/>
    </svg>
  </div>
  <div id="sheetZone"><div id="sheet"><div class="band"></div><div class="knob"></div><span class="cap t on-photo" data-t="in"></span><span class="cap b on-photo" data-t="out"></span></div></div>
  <button class="round" id="tackBtn"></button>
  <button class="round" id="kiteBtn" hidden data-t="kite"></button>
  <div id="toast"></div>
  <div id="count" class="on-photo"></div>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <div class="cols"><div>
    <div class="card-top"><img class="logo" src="/design/logo-black.svg" alt="RYC"><span class="kicker" data-t="kick"></span></div>
    <h1 data-t="title"></h1>
    <p class="sub" data-t="sub"></p>
    <div class="grid">
      <span class="meta" data-t="wind"></span>
      <div class="choice" data-opt="preset"><button data-v="light" data-t="light"></button><button data-v="medium" data-t="medium"></button><button data-v="strong" data-t="strong"></button></div>
      <span class="meta" data-t="fleetK"></span>
      <div class="choice" data-opt="fleet"><button data-v="3">3</button><button data-v="5">5</button><button data-v="7">7</button></div>
      <span class="meta" data-t="lengthK"></span>
      <div class="choice" data-opt="length"><button data-v="short" data-t="lShort"></button><button data-v="medium" data-t="lMedium"></button><button data-v="long" data-t="lLong"></button></div>
      <span class="meta" data-t="laps"></span>
      <div class="choice" data-opt="laps"><button data-v="1">1</button><button data-v="2">2</button></div>
      <span class="meta" data-t="sails"></span>
      <div class="choice" data-opt="autoTrim"><button data-v="0" data-t="manual"></button><button data-v="1" data-t="auto"></button></div>
      <span class="meta" data-t="startK"></span>
      <div class="choice" data-opt="start"><button data-v="1" data-t="m1"></button><button data-v="3" data-t="m3"></button><button data-v="5" data-t="m5"></button></div>
      <span class="meta" data-t="currentK"></span>
      <div class="choice" data-opt="current"><button data-v="0" data-t="off"></button><button data-v="1" data-t="on"></button></div>
      <span class="meta" data-t="guidesK"></span>
      <div class="choice" data-opt="guides"><button data-v="1" data-t="on"></button><button data-v="0" data-t="off"></button></div>
      <span class="meta" data-t="gfx"></span>
      <div class="choice" data-opt="gfx"><button data-v="auto" data-t="gAuto"></button><button data-v="high" data-t="gHigh"></button><button data-v="medium" data-t="gMedium"></button><button data-v="low" data-t="gLow"></button></div>
      <span class="meta" data-t="sound"></span>
      <div class="choice" data-opt="sound"><button data-v="1" data-t="on"></button><button data-v="0" data-t="off"></button></div>
    </div>
    </div><div>
    <button class="go" id="goBtn" data-t="start"></button>
    <button class="go ghost" id="resumeBtn" hidden data-t="resume"></button>
    <ul class="how">
      <li data-t="how1"></li><li data-t="how2"></li><li data-t="how5"></li><li data-t="how3"></li><li data-t="how4"></li>
    </ul>
    <p class="rotate" data-t="rotate"></p>
    <a class="back" id="backLink" href="/" data-t="back"></a>
    </div></div>
  </div>
</div>

<div class="overlay" id="results" hidden>
  <div class="card">
    <div class="card-top"><img class="logo" src="/design/logo-black.svg" alt="RYC"><span class="kicker" data-t="kick"></span></div>
    <h1 id="resTitle"></h1>
    <div class="res-wrap">
      <table class="res" id="resTable"></table>
      <canvas id="track" width="312" height="312"></canvas>
    </div>
    <button class="go" id="againBtn" data-t="again"></button>
    <button class="go ghost" id="menuBtn" data-t="menu"></button>
  </div>
</div>

</body>
